<!DOCTYPE html>
<html lang="en">
<head>
    <!--
        Name: Ashish Ajay
        File: index.html
        Date: 30-07-2026
        Description: This the index file for assignment 4, part-1(Silly story generator).
    -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
      body {
        font: 1.2em / 1.5 system-ui;
        margin: 0 auto;
        width: 500px;
      }

      fieldset {
        border: 0;
      }

      fieldset,
      legend {
        padding: 0;
        margin: 0;
      }

      input[type="text"] {
        margin-top: 5px;
        padding: 5px;
        width: 50%;
        display: block;
      }

      div,
      fieldset {
        margin-top: 20px;
      }

      .story{
        background-color: yellow;
      }
    </style>
    <title>Silly story generator</title>
</head>
<body>
    <div>
      <label for="custom-name">Enter custom name:</label>
      <input id="custom-name" type="text" placeholder="" />
    </div>
    <fieldset>
      <legend>Choose locale:</legend>
      <label for="us">US</label>
        <input id="us" type="radio" name="uk-us" value="us" checked />
      <label for="uk">UK</label>
        <input id="uk" type="radio" name="uk-us" value="uk" />
    </fieldset>
    <div>
      <button class="generate">Generate random story</button>
    </div>
    <!-- Thanks a lot to Willy Aguirre for his help with the code for this assessment -->
    <p class="story"></p>
    <script src="main.js"></script> <!--Javascript link-->
</body>
</html>
